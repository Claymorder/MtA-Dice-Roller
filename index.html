<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cg fill='%238a3ffc' stroke='white' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M64 10 L118 52 L64 118 L10 52 Z'/%3E%3Cpath d='M64 10 L38 48' fill='none'/%3E%3Cpath d='M64 10 L90 48' fill='none'/%3E%3Cpath d='M38 48 L64 66' fill='none'/%3E%3Cpath d='M90 48 L64 66' fill='none'/%3E%3Cpath d='M64 66 L64 118' fill='none'/%3E%3Cpath d='M10 52 L38 48' fill='none'/%3E%3Cpath d='M118 52 L90 48' fill='none'/%3E%3C/g%3E%3C/svg%3E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mage the Ascension Dice Roller</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scrollbar-gutter: stable both-edges;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    color: white;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: end;
    margin-bottom: 25px;
}

.panelContent {
    max-height: 450px;
    overflow-y: auto;
}

#toggleLayoutMode {
    width: 120px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;


    font-size: 16px;
    white-space: nowrap;
    background: #ffcba4;
}

#characterPanel summary,
.history summary {
    top: 0;

    background: #1e1e1e;

    z-index: 10;

    padding-top: 8px;
    padding-bottom: 8px;
}

#characterPanel[open] > *:not(summary),
.history[open] > *:not(summary) {
    padding-top: 10px;
}

#summaryStats {
    font-size: 16px !important;
    font-weight: normal !important;
    color: #cccccc;
    display: none;
}

#characterList,
#characterName,
#activeCharacterList {
    width: 250px;
}

.editorButton {
    width: 150px;

    color: black;
    background: #00ff00;

    border: 3px solid #666;
}

.field {
    display: flex;
    flex-direction: column;
}

input {
    width: 120px;
    padding: 10px;
    font-size: 18px;
    border: none;
    border-radius: 6px;
}

button {
    padding: 12px 24px;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}

#rollButton {
    background: #4CAF50;
}

#rollButton:hover {
    background: #43a047;
}

#clearHistory {
    background: #b33a3a;
}

#characterPanel[open] #summaryStats {
    display: inline;
}

#clearHistory:hover {
    background: #962f2f;
}

.history #clearHistory {
    margin-bottom: 15px;
}

.success-display {
    text-align: center;
    font-size: 72px;
    font-weight: bold;
    margin: 30px 0;
    padding: 25px;
    border-radius: 15px;
    background: #2b2b2b;
    border: 4px solid #666;
    transition: all 0.2s ease;
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
}

.dice-section {
    margin-bottom: 25px;
}

.dice-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
}

.die {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.die svg {
    width: 100%;
    height: 100%;
    display: block;
}

.die-number {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin-left: 5px;
    font-size: 20px;
    font-weight: bold;
    color: white;
}

.history {
    margin-top: 35px;
    border-top: 2px solid #444;
    padding-top: 15px;
}

.history summary {
    cursor: pointer;
    font-size: 24px;
    font-weight: bold;
    user-select: none;
    padding: 8px 0;
}

.history-entry {
    background: #2b2b2b;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.history-time {
    color: #aaa;
    margin-bottom: 5px;
}

.character-button {
    position: absolute;
    top: 20px;
    right: 20px;

    font-size: 32px;
    cursor: pointer;
}

#statButtons {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
}

.statColumn {
    min-width: 180px;
}

.statColumn h4 {
    margin-bottom: 10px;
    border-bottom: 1px solid #666;
    text-align: center;
    text-transform: capitalize;
}

.statButton {
    display: block;
    color: black;
    width: 100%;
    margin-bottom: 6px;
}

#statEditor {
    margin-top: 15px;
    margin-bottom: 15px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
}

#statEditor .statColumn {
    min-width: 280px;
}

#editorPanel .editorButton {
    margin-bottom: 5px;
}

#deleteCharacter {
    margin-top: 15px;
}

#rollButton {
    background: #4CAF50;
}

#initiativeButton {
    background: #0096FF;
    color: white;
}

#luckIndicator {
    position: fixed;
    top: 20px;
    left: 20px;

    background: #2e7d32;
    color: white;

    padding: 10px 15px;
    border-radius: 8px;

    font-weight: bold;

    z-index: 1000;
}

@media (max-width: 768px) {

    #statEditor {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    #statButtons {
        flex-direction: column;
        gap: 15px;
    }

    .controls {
        flex-direction: column;
        align-items: stretch;
    }

    #characterList,
    #characterName,
    #activeCharacterList {
        width: 100%;
    }

    .editorButton {
        width: 100%;
    }

    .statColumn {
        min-width: 0;
    }
}

</style>
</head>

<body>

<div class="container">

    <div
        class="character-button"
        title="Character Editor">
        ⚙
    </div>

    <div id="luckIndicator" style="display:none;">
        🍀 Lucky Roll Armed
    </div>

    <div id="editorPanel" style="display:none">

    <h3>Character Editor</h3>
    
    <div class="field"> 

    <label>Saved Characters:</label>

    <select id="characterList">
        <option value="">New Character</option>
    </select>

        <label>Character Name:</label>

        <input
            id="characterName"
            placeholder="Character Name"
            style="width:250px"
        >
    </div>

    <button 
        id="saveStats"
        class="editorButton">
        Save Character
    </button>

    <button
        id="deleteCharacter"
        class="editorButton"
        style="background:#b33a3a;">
        Delete Character
    </button>

    <button
        id="exportCharacter"
        class="editorButton">
        Export Character
    </button>
  
    <button
        id="importCharacter"
        class="editorButton">
        Import Character
    </button>

    <input
        type="file"
        id="importFile"
        accept=".json"
        style="display:none;">

    <div>
    <button
        id="toggleLayoutMode"
        class="editorButton">
        Edit Layout
    </button>
    </div>

        <div id="statEditor"></div>

    <div class="field">

    <div class="field">

        <label
            style="
                display:flex;
                align-items:center;
                justify-content:space-between;
                width:180px;
                margin-bottom: 6px;
                
            "
        >
            <span>Stat Maximums</span>

            <input
                type="checkbox"
                id="enforceMaximums"
            >
        </label>
    </div>
        <button 
            id="addStatButton"
            class="editorButton"
            style="background:white;">
            Add Stat
        </button>
    </div>
</div>

    <h1>Mage the Ascension Dice Roller</h1>

    <div class="field">
        <label>Current Character</label>
        <select id="activeCharacterList"></select>
    </div>

    <div class="controls">

        <div class="field">
            <label>Number of Dice</label>
            <input id="diceCount" type="number" min="1" value="5">
        </div>

        <div class="field">
            <label>Difficulty (1-10)</label>
            <input id="difficulty" type="number" min="1" max="10" value="5">
        </div>

        <button id="rollButton">ROLL</button>

        <button id="initiativeButton">
            Initiative
        </button>

    </div>

    <div id="successDisplay" class="success-display">
        0 Successes
    </div>

    <div class="dice-section">
        <h3>Main Dice</h3>
        <div id="mainDice" class="dice-row"></div>
    </div>

    <div class="dice-section">
        <h3>Exploding Dice</h3>
        <div id="bonusDiceContainer"></div>
    </div>

    <details class="history" id="characterPanel">
        <summary id="characterStatsSummary">
            <span>Character Stats</span>

            <span id="summaryStats"
                  style="
                    margin-left:20px;
                    font-size:16px;
                    font-weight:normal;
                  ">
                No stats selected | Dice Pool: 0
            </span>
        </summary>

        <div class="panelContent">

            <div id="statButtons"></div>

        </div>

    </details>

    <details class="history">
        <summary id="historySummary">History</summary>

        <div class="panelContent">

            <button id="clearHistory">
                Clear History
            </button>

            <div id="history"></div>

        </div>
    </details>

</div>

<script>

const MAX_HISTORY = 100;

let selectedStats = [];
let selectedDice = 0;
let forceTen = false;
let enforceStatMaximums = true;
let categoryOrder = getDefaultCategoryOrder();
let editLayoutMode = false;

let pendingHistoryRoll =
    JSON.parse(
        localStorage.getItem(
            "pendingHistoryRoll"
        )
    );

let rollHistory =
    JSON.parse(
        localStorage.getItem("rollHistory")
    ) || [];

const rollButton = document.getElementById("rollButton");
const clearHistoryButton = document.getElementById("clearHistory");

document.addEventListener("dragover", event => {
    event.preventDefault();
});

function updateSelectedStatsDisplay() {

    document.getElementById(
        "summaryStats"
    ).textContent =
        selectedStats.length > 0
            ? selectedStats.join(" + ") +
                " | Dice Pool: " +
                selectedDice
            : "No stats selected | Dice Pool: 0";
}

function loadHistory() {

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    rollHistory.forEach(html => {

        const entry =
            document.createElement("div");

        entry.className =
            "history-entry";

        entry.innerHTML = html;

        history.appendChild(entry);
    });
}

function deleteCharacter() {

    const name =
        document
            .getElementById("characterName")
            .value
            .trim();

    if (!name) return;

    const saveData =
        JSON.parse(
            localStorage.getItem(
                "d10Characters"
            )
        ) || {};

    if (
        !confirm(
            `Delete ${name}?`
        )
     ) {
        return;
    }

    if (
        localStorage.getItem(
            "lastCharacter"
        ) === name
    ) {
        localStorage.removeItem(
            "lastCharacter"
        );
    }

    delete saveData[name];

    localStorage.setItem(
        "d10Characters",
        JSON.stringify(saveData)
    );

    refreshCharacterList();

    const select =
        document.getElementById(
            "characterList"
        );

    if (select.options.length > 1) {

        // First real character
        select.selectedIndex = 1;

        const newCharacter =
            select.options[1].value;

        document.getElementById(
            "characterName"
        ).value = newCharacter;

        document.getElementById(
            "activeCharacterList"
        ).value = newCharacter;

        loadCharacter();
       
    }
    else {

        document.getElementById(
            "characterName"
        ).value = "";

        document.getElementById(
            "activeCharacterList"
        ).value = "";

        categoryOrder = getDefaultCategoryOrder();

        stats = getDefaultStats();

        selectedStats = [];
        selectedDice = 0;

        updateSelectedStatsDisplay();

        renderEditor();
        renderStatButtons();
    }

}

function getDefaultStats() {
    return [
        { name: "Strength", category: "Body", value: 1, maxValue: 5 },
        { name: "Dexterity", category: "Body", value: 1, maxValue: 5 },
        { name: "Stamina", category: "Body", value: 1, maxValue: 5 },

        { name: "Charisma", category: "Social", value: 1, maxValue: 5 },
        { name: "Manipulation", category: "Social", value: 1, maxValue: 5 },
        { name: "Appearance", category: "Social", value: 1, maxValue: 5 },

        { name: "Perception", category: "Mental", value: 1, maxValue: 5 },
        { name: "Intelligence", category: "Mental", value: 1, maxValue: 5 },
        { name: "Wits", category: "Mental", value: 1, maxValue: 5 },

        { name: "Arete", category: "Other", value: 1, maxValue: 10 },
        { name: "Willpower", category: "Other", value: 10, maxValue: 10 }
    ];
}

function renderStatButtons() {

    const container =
        document.getElementById("statButtons");

    container.innerHTML = "";

    const categories = {};

    stats.forEach(stat => {

        const category =
            (stat.category || "Other")
                .trim()
                .toLowerCase();

        if (!categories[category]) {
            categories[category] = [];
        }

        categories[category].push(stat);
    });

    categoryOrder
        .filter(category => categories[category])
        .forEach(category => {

            let html = `
                <div class="statColumn">
                    <h4 style="
                        border-bottom:1px solid #666;
                        margin-bottom:10px;
                ">
                ${category}
                </h4>
            `;

            categories[category]
                .forEach(stat => {

                    const highlightStat =
                        stat.value > stat.maxValue;


                    html += `
                        <button
                            class="statButton"
                            style="
                                background:${
                                    highlightStat
                                        ? '#00BFFF'
                                        : 'white'
                                };
                                color:black;
                            "
                            onclick="selectStat('${stat.name}', ${stat.value})">
                            ${stat.name} (${stat.value})
                        </button>
                    `;
                });

            html += "</div>";

            container.innerHTML += html;
        });
}

function saveCharacter() {

    const name =
        document
        .getElementById(
            "characterName"
        )
        .value
        .trim();

    if (!name) return;

    const saveData =
        JSON.parse(
            localStorage.getItem(
                "d10Characters"
            )
        ) || {};

    saveData[name] = {
        stats: stats,
        categoryOrder: categoryOrder,
        enforceStatMaximums:
            enforceStatMaximums
    };

    localStorage.setItem(
        "d10Characters",
        JSON.stringify(saveData)
    );

    localStorage.setItem(
        "lastCharacter",
        name
    );

    refreshCharacterList();

    document.getElementById(
        "characterList"
    ).value = name;

    document.getElementById(
        "activeCharacterList"
    ).value = name;

}

function exportCharacter() {

    const name =
        document.getElementById(
            "characterName"
        ).value.trim();

    if (!name) return;

    const characterData = {
        name: name,
        stats: stats,
        categoryOrder: categoryOrder
    };


    const blob = new Blob(
        [JSON.stringify(characterData, null, 2)],
        { type: "application/json" }
    );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = `${name}.json`;

    link.click();

    URL.revokeObjectURL(url);
}

function moveCategoryUp(category) {

    const index =
        categoryOrder.indexOf(category);

    if (index <= 0) return;

    [
        categoryOrder[index - 1],
        categoryOrder[index]
    ] = [
        categoryOrder[index],
        categoryOrder[index - 1]
    ];

    renderEditor();
    renderStatButtons();
}

function moveCategoryDown(category) {

    const index =
        categoryOrder.indexOf(category);

    if (
        index === -1 ||
        index === categoryOrder.length - 1
    ) {
        return;
    }

    [
        categoryOrder[index + 1],
        categoryOrder[index]
    ] = [
        categoryOrder[index],
        categoryOrder[index + 1]
    ];

    renderEditor();
    renderStatButtons();
}

function importCharacter(file) {

    const reader = new FileReader();

    reader.onload = function(event) {

        const character =
            JSON.parse(event.target.result);

        const saveData =
            JSON.parse(
                localStorage.getItem(
                    "d10Characters"
                )
            ) || {};

        saveData[character.name] = {
            stats: character.stats,
            categoryOrder:
                character.categoryOrder || [
                    "body",
                    "social",
                    "mental",
                    "other"
                ]
        };

        localStorage.setItem(
            "d10Characters",
            JSON.stringify(saveData)
        );

        localStorage.setItem(
            "lastCharacter",
            character.name
        );

        refreshCharacterList();

        document.getElementById(
            "characterName"
        ).value = character.name;

        document.getElementById(
            "characterList"
        ).value = character.name;

        document.getElementById(
            "activeCharacterList"
        ).value = character.name;

        loadCharacter();
    };

    reader.readAsText(file);
}

function loadCharacter() {

    const name =
        document
        .getElementById(
            "characterName"
        )
        .value
        .trim();

    const saveData =
        JSON.parse(
            localStorage.getItem(
                "d10Characters"
            )
        ) || {};

    if (!saveData[name])
        return;

    if (Array.isArray(saveData[name])) {

    // Old save format
    stats = saveData[name];

    categoryOrder = [
        ...new Set(
            stats.map(
                stat =>
                    (stat.category || "other")
                        .trim()
                        .toLowerCase()
            )
        )
    ];
} else {

    // New save format
    stats = saveData[name].stats;

    const defaults = getDefaultStats();

    stats.forEach(stat => {

        const defaultStat =
            defaults.find(
                d => d.name === stat.name
            );
    
        if (defaultStat) {

            stat.maxValue =
                defaultStat.maxValue;

            if (enforceStatMaximums) {

                stat.value = Math.min(
                    stat.value,
                    stat.maxValue
                );

            }
        }

    });

    categoryOrder =
        saveData[name].categoryOrder || [
            "body",
            "social",
            "mental",
            "other"
        ];

    enforceStatMaximums =
        saveData[name]
            .enforceStatMaximums ?? true;

    document.getElementById(
        "enforceMaximums"
    ).checked =
        enforceStatMaximums;

    stats.forEach(stat => {

        const category =
            (stat.category || "other")
                .trim()
                .toLowerCase();

        if (!categoryOrder.includes(category)) {
            categoryOrder.push(category);
        }

    });
}

    renderEditor();

    selectedStats = [];
    selectedDice = 0;

    updateSelectedStatsDisplay();

    document.getElementById(
        "activeCharacterList"
    ).value = name;

    document.getElementById(
        "characterList"
    ).value = name;

    localStorage.setItem(
        "lastCharacter",
        name
    );
}

function getDefaultCategoryOrder() {
    return [
        "body",
        "social",
        "mental",
        "other"
    ];
}

function refreshCharacterList() {

    const editorSelect =
        document.getElementById("characterList");

    const activeSelect =
        document.getElementById("activeCharacterList");

    editorSelect.innerHTML =
        '<option value="">New Character</option>';

    const saveData =
        JSON.parse(
            localStorage.getItem(
                "d10Characters"
            )
        ) || {};

    const characterNames =
        Object.keys(saveData);

    if (characterNames.length === 0) {

        activeSelect.innerHTML =
            '<option value="">No Character</option>';

    } else {

        activeSelect.innerHTML = "";
    }

    characterNames
        .forEach(name => {

            editorSelect.innerHTML += `
                <option value="${name}">
                    ${name}
                </option>
            `;

            activeSelect.innerHTML += `
                <option value="${name}">
                    ${name}
                </option>
            `;
        });
}

let stats = getDefaultStats();

function renderEditor() {

    const editor =
        document.getElementById("statEditor");

    editor.innerHTML = "";

    const statNameWidth =
        getStatNameWidth();

    const categories = {};

    stats.forEach((stat, index) => {

        const category =
            (stat.category || "Other")
                .trim()
                .toLowerCase();

        if (!categories[category]) {
            categories[category] = [];
        }

        categories[category].push({
            stat,
            index
        });
    });

    categoryOrder
        .filter(category => categories[category])
        .forEach(category => {

            editor.innerHTML += `
                <div class="statColumn">
                    <h4>
                        ${category}
                        ${editLayoutMode ? `
                            <button
                                onclick="moveCategoryUp('${category}')"
                                style="
                                    width:35px;
                                    padding:0;
                                    background:#4CAF50;
                                    color:white;
                                    font-weight:bold;
                                ">
                                ▲
                            </button>

                            <button
                                onclick="moveCategoryDown('${category}')"
                                style="
                                    width:35px;
                                    padding:0;
                                    background:#1565c0;
                                    color:white;
                                    font-weight:bold;
                                ">
                                ▼
                            </button>
                        ` : ''}
                    </h4>

                    <div id="editor-${category}">
                    </div>
                </div>
            `;
        });

    categoryOrder
        .filter(category => categories[category])
        .forEach(category => {
    
            const column =
                document.getElementById(
                    `editor-${category}`
                );

            categories[category]
                .forEach(({stat,index}) => {

                    column.innerHTML += `
                        <div style="
                            display:flex;
                            justify-content:center;
                            gap:10px;
                            margin-bottom:8px;
                            align-items:center;
                        ">
                             ${editLayoutMode ? `
                                <button
                                    onclick="removeStat(${index})"
                                    style="
                                        background:#b33a3a;
                                        width:35px;
                                        padding:0;
                                    ">
                                    −
                                </button>

                                <button
                                    onclick="moveStatUp(${index})"
                                    style="
                                        background:#4CAF50;
                                        width:30px;
                                        padding:0;
                                    ">
                                    ▲
                                </button>

                                <button
                                    onclick="moveStatDown(${index})"
                                    style="
                                        background:#1565c0;
                                        width:30px;
                                        padding:0;
                                    ">
                                    ▼
                                </button>
                            ` : ''}

                            <input
                                style="width:${statNameWidth}px"
                                value="${stat.name}"
                                onchange="
                                    stats[${index}].name=
                                    this.value.trim();

                                    renderEditor();
                                "
                            >

                            <input
                                style="width:60px"
                                type="number"
                                min="1"
                                max="${ enforceStatMaximums ? (stat.maxValue || 10) : '' }"
                                value="${stat.value}"
                                onchange="
                                    stats[${index}].value =
                                        enforceStatMaximums
                                            ? Math.min(
                                                ${stat.maxValue || 10},
                                                Math.max(
                                                    1,
                                                    Number(this.value)
                                                )
                                            )
                                            : Math.max(
                                                1,
                                                Number(this.value)
                                            );

                                    this.value =
                                        stats[${index}].value;

                                    renderStatButtons();
                                "
                            >
                            <input
                                style="width:90px"
                                value="${
                                    (stat.category || '')
                                        .charAt(0).toUpperCase() +
                                    (stat.category || '')
                                        .slice(1)
                                        .toLowerCase()
                                }"
                                onchange="
                                    stats[${index}].category =
                                        this.value
                                            .trim()
                                            .toLowerCase();
                                    
                                    if (
                                        !categoryOrder.includes(
                                            stats[${index}].category
                                        )

                                        );
                                    }

                                "
                            >

                    `;
                });
        });

}

function moveStatUp(index) {

    if (index <= 0) return;

    const currentCategory =
        stats[index].category;

    if (
        stats[index - 1].category ===
        currentCategory
    ) {

        [
            stats[index - 1],
            stats[index]
        ] = [
            stats[index],
            stats[index - 1]
        ];

        renderEditor();
        renderStatButtons();
    }
}

function moveStatDown(index) {

    if (
        index >= stats.length - 1
    ) {
        return;
    }

    const currentCategory =
        stats[index].category;

    if (
        stats[index + 1].category ===
        currentCategory
    ) {

        [
            stats[index],
            stats[index + 1]
        ] = [
            stats[index + 1],
            stats[index]
        ];

        renderEditor();
        renderStatButtons();
    }
}

function removeStat(index) {

    stats.splice(index, 1);

    renderEditor();
}

function getStatNameWidth() {

    const canvas =
        document.createElement("canvas");

    const context =
        canvas.getContext("2d");

    context.font = "18px Arial";

    const longestWidth =
        Math.max(
            ...stats.map(
                stat =>
                    context.measureText(
                        stat.name
                    ).width
            )
        );

    const computed =
        longestWidth +
        20 + // left/right padding
        4;   // border + rounding buffer

    return Math.min(
        180,
        Math.ceil(computed)
    );
}

function rollDice() {

    const count = parseInt(document.getElementById("diceCount").value);
    const difficultyInput =
    document.getElementById("difficulty");

    let hitTotalDiceLimit = false;
    let hitExplosionDepthLimit = false;

difficultyInput.value =
    Math.min(10, Math.max(1,
        parseInt(difficultyInput.value)));

const difficulty =
    parseInt(difficultyInput.value);

    if (count < 1) return;
    if (difficulty < 1 || difficulty > 10) return;

    let successes = 0;
    let positiveSuccesses = 0;
    let botches = 0;

    const mainDice = [];
    const bonusRows = [];
    let totalDiceRolled = 0;
    const MAX_TOTAL_DICE = 6000;


    document.getElementById("mainDice").innerHTML = "";
    document.getElementById("bonusDiceContainer").innerHTML = "";

    let pendingExplosions = [];

    // Main Dice

    for (let i = 0; i < count; i++) {

        if (totalDiceRolled >= MAX_TOTAL_DICE) {
            hitTotalDiceLimit = true;
            break;
        }

        const roll = rollDie();

        mainDice.push(roll);

        totalDiceRolled++;

        if (roll === 1) {
            successes--;
            botches++;
        }
        else if (roll >= difficulty) {
            successes++;
            positiveSuccesses++;
        }

        if (roll === 10) {
            pendingExplosions.push(true);
        }
    }

    mainDice.forEach(value => {
        document.getElementById("mainDice")
            .appendChild(createDieElement(value, difficulty));
    });

    // Bonus Dice Chains

    let explosionDepth = 0;

    while (
        pendingExplosions.length > 0 &&
        explosionDepth < 20
    ) {
        explosionDepth++;

        const currentRow = [];
        const nextExplosions = [];

        for (let i = 0; i < pendingExplosions.length; i++) {

            if (totalDiceRolled >= MAX_TOTAL_DICE) {
                hitTotalDiceLimit = true;
                pendingExplosions = [];
                break;
            }

            const roll = rollDie();

            currentRow.push(roll);

            totalDiceRolled++;

            if (roll >= difficulty) {
                successes++;
                positiveSuccesses++;
            }

            if (roll === 10) {
                nextExplosions.push(true);
            }
        }
        if (
            pendingExplosions.length > 0 &&
            explosionDepth >= 20
        ) {
            hitExplosionDepthLimit = true;
        }

        bonusRows.push(currentRow);
        pendingExplosions = nextExplosions;
    }

    bonusRows.forEach(row => {

        const rowDiv = document.createElement("div");
        rowDiv.className = "dice-row";

        row.forEach(value => {
            rowDiv.appendChild(
                createDieElement(value, difficulty)
            );
        });

        document.getElementById("bonusDiceContainer")
            .appendChild(rowDiv);
    });

    const successDisplay = document.getElementById("successDisplay");

if (
    positiveSuccesses === 0 &&
    botches > 0
) {

    successDisplay.textContent =
        "Botched";

} else {

    successDisplay.textContent =
        `${successes} ${
            Math.abs(successes) === 1
                ? "Success"
                : "Successes"
        }`;

}

if (hitTotalDiceLimit) {

    successDisplay.innerHTML += `
        <div style="
            color:#ff6b6b;
            font-size:18px;
            margin-top:10px;
        ">
            ⚠ Roll stopped at the ${totalDiceRolled.toLocaleString()} dice limit.
        </div>
    `;
}

if (hitExplosionDepthLimit) {

    successDisplay.innerHTML += `
        <div style="
            color:#ff6b6b;
            font-size:18px;
            margin-top:10px;
        ">
            ⚠ Roll stopped because the explosion chain reached the maximum depth (20).
        </div>
    `;
}

// console.log(
//     "Total dice rolled:",
//     totalDiceRolled
// );

if (successes > 0) {
    successDisplay.style.color = "#7CFF7C";
    successDisplay.style.borderColor = "#2e7d32";
}
else if (successes < 0) {
    successDisplay.style.color = "#ff6b6b";
    successDisplay.style.borderColor = "#c62828";
}
else {
    successDisplay.style.color = "#ffffff";
    successDisplay.style.borderColor = "#666";
}

successDisplay.animate(
[
    { transform: "scale(0.9)" },
    { transform: "scale(1.05)" },
    { transform: "scale(1.0)" }
],
{
    duration: 250
});

    const characterName =
        document.getElementById(
            "characterName"
        ).value.trim() ||
        "No Character";

    if (pendingHistoryRoll) {
        addHistory(
            pendingHistoryRoll.count,
            pendingHistoryRoll.characterName,
            pendingHistoryRoll.difficulty,
            pendingHistoryRoll.successes,
            pendingHistoryRoll.mainDice,
            pendingHistoryRoll.bonusRows,
            pendingHistoryRoll.luckyRoll,
            pendingHistoryRoll.isInitiative,
            pendingHistoryRoll.initiative,
            pendingHistoryRoll.botched,
            pendingHistoryRoll.hitTotalDiceLimit,
            pendingHistoryRoll.hitExplosionDepthLimit
        );

        pendingHistoryRoll = null;

        localStorage.removeItem(
            "pendingHistoryRoll"
        );
    }

    pendingHistoryRoll = {
        characterName,
        count,
        difficulty,
        successes,
        mainDice: [...mainDice],
        bonusRows: [...bonusRows],
        luckyRoll: forceTen,
        botched:
            positiveSuccesses === 0 &&
            botches > 0,

        hitTotalDiceLimit,
        hitExplosionDepthLimit
    };

    localStorage.setItem(
        "pendingHistoryRoll",
        JSON.stringify(pendingHistoryRoll)
    );


    selectedStats = [];
    selectedDice = 0;

    updateSelectedStatsDisplay();

    forceTen = false;

    document.getElementById(
        "luckIndicator"
    ).style.display = "none";


}

function rollInitiative() {

    const dexterity =
        stats.find(
            stat =>
                stat.name === "Dexterity"
        )?.value || 0;

    const wits =
        stats.find(
            stat =>
                stat.name === "Wits"
        )?.value || 0;

    const roll = rollDie();
  
    document.getElementById(
        "mainDice"
    ).innerHTML = "";

    document.getElementById(
        "bonusDiceContainer"
    ).innerHTML = "";

    document.getElementById(
        "mainDice"
    ).appendChild(
        createDieElement(
            roll,
            1
        )
    );

    const initiative =
        roll +
        dexterity +
        wits;

    const characterName =
        document.getElementById(
            "characterName"
        ).value.trim() ||
        "No Character";
   
    if (pendingHistoryRoll) {
        addHistory(
            pendingHistoryRoll.count,
            pendingHistoryRoll.characterName,
            pendingHistoryRoll.difficulty,
            pendingHistoryRoll.successes,
            pendingHistoryRoll.mainDice,
            pendingHistoryRoll.bonusRows,
            pendingHistoryRoll.luckyRoll,
            pendingHistoryRoll.isInitiative,
            pendingHistoryRoll.initiative,
            pendingHistoryRoll.botched,
            pendingHistoryRoll.hitTotalDiceLimit,
            pendingHistoryRoll.hitExplosionDepthLimit
        );

        pendingHistoryRoll = null;

        localStorage.removeItem(
            "pendingHistoryRoll"
        );
    }

    pendingHistoryRoll = {
        characterName,
        isInitiative: true,
        initiative: {
            total: initiative,
            roll: roll,
            dexterity: dexterity,
            wits: wits
        }
    };

    localStorage.setItem(
        "pendingHistoryRoll",
        JSON.stringify(pendingHistoryRoll)
    );

    const successDisplay =
        document.getElementById(
            "successDisplay"
        );

    successDisplay.innerHTML =
        `
        <div>Initiative: ${initiative}</div>

        <div style="
            font-size:24px;
            margin-top:10px;
        ">
            D10: ${roll}
            | Dex: ${dexterity}
            | Wits: ${wits}
        </div>
        `;


    successDisplay.style.color =
        "#ffffff";

    successDisplay.style.borderColor =
        "#666";

    successDisplay.animate(
        [
            { transform: "scale(0.9)" },
            { transform: "scale(1.05)" },
            { transform: "scale(1.0)" }
        ],
        {
            duration: 250
        }
    );
}


function addHistory(
    count,
    characterName,
    difficulty,
    successes,
    mainDice,
    bonusRows,
    luckyRoll,
    isInitiative = false,
    initiativeData = null,
    botched = false,
    hitTotalDiceLimit = false,
    hitExplosionDepthLimit = false
) 
{

    const history = document.getElementById("history");

    const entry = document.createElement("div");
    entry.className = "history-entry";

    const timestamp = new Date().toLocaleTimeString();

    let html = "";

    if (isInitiative) {

        html += `
            <div class="history-time">${timestamp}</div>

            <strong>Character:</strong>
            ${characterName}<br>

            <strong>⚡ Initiative Roll</strong><br>

            Total: ${initiativeData.total}<br>

            D10: ${initiativeData.roll}
            | Dex: ${initiativeData.dexterity}
            | Wits: ${initiativeData.wits}
        `;

        entry.innerHTML = html;

        rollHistory.unshift(html);

        history.prepend(entry);

        localStorage.setItem(
            "rollHistory",
            JSON.stringify(rollHistory)
        );

        return;
    }

    if (luckyRoll) {
        html += `
            <div style="
                color:#7CFF7C;
                font-weight:bold;
                margin-bottom:5px;
            ">
                🍀 Lucky Roll Active
            </div>
        `;
    }

    html += `
        <div class="history-time">${timestamp}</div>

        <strong>Character:</strong>
        ${characterName}<br>

        <strong>${count} Dice @ Difficulty ${difficulty}</strong><br>

        ${
            botched
                ? "Botched"
                : `Successes: ${successes}`
        }
    `;

    if (hitTotalDiceLimit) {

        html += `
            <br>
            ⚠ Total Dice Limit Reached
        `;
    }

    if (hitExplosionDepthLimit) {

        html += `
            <br>
        ⚠ Explosion Depth Limit Reached
        `;
    }

    html += `
        <br>
        Main: ${mainDice.join(", ")}
    `;

    bonusRows.forEach((row, index) => {
        html += `<br>Exploding Dice ${index + 1}: ${row.join(", ")}`;
    });

    entry.innerHTML = html;

    rollHistory.unshift(html);

    localStorage.setItem(
        "rollHistory",
        JSON.stringify(rollHistory)
    );

    history.prepend(entry);



while (rollHistory.length > MAX_HISTORY) {

}

);

    localStorage.getItem("lastCharacter");

if (lastCharacter) {

    document.getElementById(
        "characterName"
    ).value = lastCharacter;

    document.getElementById(
        "activeCharacterList"
    ).value = lastCharacter;

    document.getElementById(
        "characterList"
    ).value = lastCharacter;

    loadCharacter();
}

document.addEventListener("drop", event => {

    event.preventDefault();

    if (
        event.dataTransfer.files &&
        event.dataTransfer.files.length > 0
    ) {

        const file =
            event.dataTransfer.files[0];

        if (
            file.name
                .toLowerCase()
                .endsWith(".json")
        ) {

            importCharacter(file);
        }
    }
});

document
.getElementById("toggleLayoutMode")
.addEventListener("click", () => {

    editLayoutMode = !editLayoutMode;

    document.getElementById(
        "toggleLayoutMode"
    ).textContent =
        editLayoutMode
            ? "Done Editing"
            : "Edit Layout";

    renderEditor();
});

document.addEventListener("touchstart", function(event) {

    const activeElement =
        document.activeElement;

    if (
        activeElement &&
        (
            activeElement.tagName === "INPUT" ||
            activeElement.tagName === "TEXTAREA"
        ) &&
        !event.target.closest("input") &&
        !event.target.closest("textarea")
    ) {
        activeElement.dispatchEvent(
            new Event("change")
        );
    }
});

document.addEventListener("focusout", (event) => {

    if (
        event.target &&
        event.target.tagName === "INPUT" &&
        event.target.type !== "number"
    ) {

        event.target.value =
            event.target.value.trim();
    }
});

document.addEventListener("keydown", (event) => {

    if (
        event.code !== "PageUp" &&
        event.code !== "PageDown"
    ) {
        return;
    }

    const activeElement =
        document.activeElement;

    if (
        activeElement &&
        (
            activeElement.tagName === "INPUT" ||
            activeElement.tagName === "TEXTAREA"
        )
    ) {

        activeElement.dispatchEvent(
            new Event("change")
        );
    }

    const selector =
        document.getElementById(
            "activeCharacterList"
        );

    if (selector.options.length <= 1) {
        return;
    }

    let currentIndex =
        selector.selectedIndex;

    if (currentIndex < 0) {
        currentIndex = 0;
    }

    if (event.code === "PageDown") {

        currentIndex =
            (currentIndex + 1) %
            selector.options.length;

    } else {

        currentIndex =
            (currentIndex - 1 +
             selector.options.length) %
            selector.options.length;

    }

    selector.selectedIndex =
        currentIndex;

    const selectedName =
        selector.options[
            currentIndex
        ].value;

    document.getElementById(
        "characterName"
    ).value = selectedName;

    document.getElementById(
        "characterList"
    ).value = selectedName;

    loadCharacter();

    event.preventDefault();
});

document
.querySelectorAll("summary")
.forEach(summary => {

    summary.addEventListener(
        "click",
        () => {
            summary.blur();
        }
    );

});

renderEditor();

loadHistory();

if (pendingHistoryRoll) {

    addHistory(
        pendingHistoryRoll.count,
        pendingHistoryRoll.characterName,
        pendingHistoryRoll.difficulty,
        pendingHistoryRoll.successes,
        pendingHistoryRoll.mainDice,
        pendingHistoryRoll.bonusRows,
        pendingHistoryRoll.luckyRoll,
        pendingHistoryRoll.isInitiative,
        pendingHistoryRoll.initiative,
        pendingHistoryRoll.botched,
        pendingHistoryRoll.hitTotalDiceLimit,
        pendingHistoryRoll.hitExplosionDepthLimit
    );

    pendingHistoryRoll = null;

    localStorage.removeItem(
        "pendingHistoryRoll"
    );
}

</script>

</body>
</html>
